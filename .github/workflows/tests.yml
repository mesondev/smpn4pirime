name: SIMS automated checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, fileinfo, mbstring, pdo, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Start PHP test server
        run: |
          nohup php -S 127.0.0.1:8000 -t "$GITHUB_WORKSPACE" \
            > /tmp/sims-php-server.log 2>&1 &

          for attempt in {1..30}; do
            if curl -sS -o /dev/null \
              http://127.0.0.1:8000/login.php; then
              echo "PHP test server is ready."
              exit 0
            fi

            sleep 1
          done

          echo "PHP test server failed to start."
          cat /tmp/sims-php-server.log
          exit 1

      - name: Run automated tests
        env:
          SIMS_TEST_HTTP: '1'
          SIMS_TEST_BASE_URL: 'http://127.0.0.1:8000'
          SIMS_TEST_DB: '0'
        run: composer test
