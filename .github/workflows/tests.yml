name: SIMS automated checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, fileinfo, mbstring, pdo, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start server and run automated tests
        env:
          SIMS_TEST_HTTP: '1'
          SIMS_TEST_BASE_URL: 'http://127.0.0.1:8000'
          SIMS_TEST_DB: '0'
        run: |
          php -S 127.0.0.1:8000 -t "$GITHUB_WORKSPACE" \
            > /tmp/sims-php-server.log 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          echo "Waiting for PHP test server..."

          SERVER_READY=0

          for attempt in {1..30}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "PHP server process stopped."
              cat /tmp/sims-php-server.log
              exit 1
            fi

            if curl -sS -o /dev/null \
              http://127.0.0.1:8000/login.php; then
              SERVER_READY=1
              break
            fi

            sleep 1
          done

          if [ "$SERVER_READY" -ne 1 ]; then
            echo "PHP test server is unavailable."
            cat /tmp/sims-php-server.log
            exit 1
          fi

          echo "PHP test server is ready."
          php tests/run.php
